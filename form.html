<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
	
	<style>
	
	/* General page styling */
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f2f4f7;
    color: #333;
}

/* Form container */
form {
    width: 500px;
    max-width: 90%;
    margin: 40px auto;
    padding: 30px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

/* Registration Form heading */
body > p {
    text-align: center;
    font-size: 28px;
    color: #2c3e50;
    margin-top: 30px;
}

/* Labels */
label {
    display: inline-block;
    margin: 10px 5px 6px 0;
    font-weight: bold;
    color: #34495e;
}

/* Text inputs, select, date, email, password and file input */
input[type="text"],
input[type="email"],
input[type="password"],
input[type="date"],
select,
input[type="file"],
textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 15px;
}

/* Focus effect */
input[type="text"]:focus,
input[type="email"]:focus,
input[type="password"]:focus,
input[type="date"]:focus,
select:focus,
textarea:focus {
    border-color: #3498db;
    outline: none;
    box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
}

/* Radio buttons and checkboxes */
input[type="radio"],
input[type="checkbox"] {
    width: auto;
    margin-right: 8px;
}

/* Gender and fruit labels */
input[type="radio"] + label,
input[type="checkbox"] + label {
    font-weight: normal;
}

/* Paragraphs containing radio buttons and checkboxes */
form p {
    margin-top: 5px;
    margin-bottom: 15px;
}

/* Textarea */
textarea {
    resize: vertical;
    min-height: 100px;
}

/* Buttons */
input[type="submit"],
input[type="reset"] {
    padding: 11px 25px;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 10px;
}

/* Submit button */
input[type="submit"] {
    background-color: #27ae60;
}

input[type="submit"]:hover {
    background-color: #219150;
}

/* Reset button */
input[type="reset"] {
    background-color: #e74c3c;
}

input[type="reset"]:hover {
    background-color: #c0392b;
}

/* Mobile responsive design */
@media (max-width: 600px) {

    form {
        width: auto;
        margin: 20px;
        padding: 20px;
    }

    body > p {
        font-size: 24px;
    }
}

	</style>
</head>

<body>

    <p><strong>Registration Form</strong></p>

    <form>

        <label for="title">Title</label>
        <select id="title" name="title">
            <option value="MR">MR</option>
            <option value="MS">MS</option>
            <option value="MRS">MRS</option>
            <option value="MASTER">MASTER</option>
        </select>

        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName">

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName">

        <br><br>

        <label for="email">Email ID</label>
        <input type="email" id="email" name="email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <label>Gender</label>

        <p>
            <label>
                <input type="radio" name="gender" value="M">
                Male
            </label>

            <br>

            <label>
                <input type="radio" name="gender" value="F">
                Female
            </label>
        </p>

        <br>

        <label>Favorite Fruits</label>

        <p>
            <label>
                <input type="checkbox" name="fruit" value="Apple">
                Apple
            </label>

            <br>

            <label>
                <input type="checkbox" name="fruit" value="Mango">
                Mango
            </label>

            <br>

            <label>
                <input type="checkbox" name="fruit" value="Strawberry">
                Strawberry
            </label>
        </p>

        <label for="message">Address / Comments</label>
        <br>
        <textarea id="message" name="message" rows="5" cols="30"></textarea>

        <br><br>

        <label for="file">Upload File</label>
        <input type="file" id="file" name="file">

        <br><br>

        <input type="reset" value="Reset">
        <input type="submit" value="Submit">

    </form>

</body>

</html>
